<button
  class="dropdown__trigger"
  [class.dropdown__trigger--open]="isOpen()"
  type="button"
  role="combobox"
  aria-haspopup="listbox"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="listboxId"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-describedby]="ariaDescribedBy()"
  [attr.aria-required]="isRequired() || null"
  [disabled]="isDisabled()"
  (click)="toggle()"
  (keydown)="handleKeydown($event)"
>
  <span>
    {{ label() }}
    @if (isRequired()) {
      <span class="dropdown__required" aria-hidden="true">*</span>
    }
  </span>
  <svg class="dropdown__arrow" viewBox="0 0 24 24" aria-hidden="true">
    <use href="assets/icons/arrow-drop-down.svg#icon"></use>
  </svg>
</button>
<ul
  class="dropdown__menu"
  [class.dropdown__menu--open]="isOpen()"
  role="listbox"
  [id]="listboxId"
  [attr.aria-label]="label()"
>
  @for (option of options(); track option.value) {
    <li
      class="dropdown__option"
      [class.dropdown__option--active]="$index === activeIndex()"
      role="option"
      [id]="getOptionId($index)"
      [attr.aria-selected]="option.value === selectedValue()"
      (click)="selectOption(option)"
      (mouseenter)="setActiveIndex($index)"
    >
      {{ option.label }}
    </li>
  }
</ul>
@if (selectedLabel(); as selectedOptionLabel) {
  <p class="dropdown__selection">{{ selectedOptionLabel }}</p>
}

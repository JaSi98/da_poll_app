<app-dropdown
  label="Choose category"
  [options]="categoryOptions()"
  [selectedValue]="selectedCategoryId()"
  [isDisabled]="isDisabled()"
  [isRequired]="true"
  [ariaDescribedBy]="hasError() ? errorId : null"
  (selectedValueChange)="selectCategory($event)"
/>
@if (hasError()) {
  <p class="category-select__error" [id]="errorId">Please choose a category.</p>
}

<label
  class="checkbox"
  [class.checkbox--disabled]="isDisabled()"
  [class.checkbox--hoverable]="hasHoverEffect()"
>
  <input
    class="checkbox__input"
    [type]="type()"
    [attr.name]="name()"
    [checked]="checked()"
    [disabled]="isDisabled()"
    [attr.aria-label]="ariaLabel()"
    (change)="updateChecked($event)"
  />
  <span class="checkbox__box" aria-hidden="true">
    @if (checked()) {
      <svg class="checkbox__check" viewBox="0 0 10 8">
        <use href="assets/icons/checkbox-check.svg#icon"></use>
      </svg>
    }
  </span>
  <span class="checkbox__label"><ng-content /></span>
</label>
